<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبلغ التأمين</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="assetts/css/style.css">
</head>

<body>
    <div id="loading-screen">
        <span class="loader"></span>
    </div>
    <div class="very-big">
        <div class="modal-overlay">
            <div class="modal">
                <button class="close-button" onclick="goBack()">×</button>
                <h1 class="modal-title">مبلغ التأمين</h1>
                <p class="modal-text">يجب دفع مبلغ التأمين قبل البدء في المزايدة</p>
                <p class="modal-amount">المبلغ <strong>200 ريال سعودي</strong></p>
                <a href="final.html" class="btn-submit">اتمام الدفع</a>
            </div>
        </div>
    </div>

    <script src="assetts/js/bootstrap.bundle.min.js"></script>
    <script>
        function goBack() {
            if (document.referrer !== "") {
                window.history.back();
            } else {
                window.location.href = "payment.html"; // Change to a relevant page
            }
        }

        // Add an event listener for the DOMContentLoaded event (fires after HTML is loaded)
        document.addEventListener("DOMContentLoaded", function () {
            const loadingScreen = document.getElementById("loading-screen");

            // Add a slight delay before hiding the loading screen for smoothness
            setTimeout(() => {
                loadingScreen.classList.add("hidden"); // Add the "hidden" class to fade out
            }, 500); // Adjust delay as needed (e.g., 500ms)
        });

        // Show loading screen before navigating away
        window.addEventListener("beforeunload", function () {
            const loadingScreen = document.getElementById("loading-screen");
            loadingScreen.classList.remove("hidden"); // Show loading screen
        });
    </script>
</body>

</body>

</html>
