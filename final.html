<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Confirmation</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="assetts/css/bootstrap.min.css">
    <link rel="stylesheet" href="assetts/css/style.css">
</head>

<body>

    <div id="loading-screen">
        <span class="loader"></span>
    </div>
    <div class="big">
        <div class="confirmation-container-suc animate__animated animate__fadeIn animate__delay-1s">
            <div class=" icon1"><i class="fa-solid fa-check"></i></div>
            <h1>مبروك تم اتمام الدفع</h1>
            <p>شكراً لاستخدامكم منصة مزاد<br>سيتم التواصل معكم من قبل صاحب السيارة لاتمام الاستلام</p>
            <a href="home.html" class="button">عودة للرئيسية</a>
        </div>
    </div>
    <script src="assetts/js/bootstrap.bundle.min.js"></script>
    <script>
        // Add an event listener for the DOMContentLoaded event (fires after HTML is loaded)
        document.addEventListener("DOMContentLoaded", function () {
            const loadingScreen = document.getElementById("loading-screen");

            // Add a slight delay before hiding the loading screen for smoothness
            setTimeout(() => {
                loadingScreen.classList.add("hidden"); // Add the "hidden" class to fade out
            }, 500);
        });

        // Show loading screen before navigating away
        window.addEventListener("beforeunload", function () {
            const loadingScreen = document.getElementById("loading-screen");
            loadingScreen.classList.remove("hidden"); // Show loading screen
        });
    </script>
</body>

</html>
